name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Install dependencies
        run: npm install

      - name: Verify React Native CLI config
        run: |
          npx react-native config > /tmp/react-native-config.json
          node -e "const c=require('/tmp/react-native-config.json'); if(!c.project?.android?.packageName){console.error(JSON.stringify(c.project||{},null,2)); process.exit(1)}; console.log('Android packageName:', c.project.android.packageName)"

      - name: Clean Android generated files
        working-directory: android
        run: gradle --no-daemon clean

      - name: Verify Gradle
        run: gradle --version

      - name: Build Debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: papeleria-arcoiris-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
